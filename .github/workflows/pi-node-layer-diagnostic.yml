---
name: Diagnose updated Node CLI layer

'on':
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'feat/add-pi-coding-agent'
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce Node CLI install layer
        shell: bash
        run: |
          cat > /tmp/Dockerfile.pi-node-layer <<'DOCKERFILE'
          FROM ubuntu:26.04
          SHELL ["/bin/bash", "-euxo", "pipefail", "-c"]
          ARG PI_CODING_AGENT_VERSION=0.80.6
          ENV DEBIAN_FRONTEND=noninteractive \
              VOLTA_HOME=/opt/volta \
              PATH="/opt/volta/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          RUN apt-get update && \
              apt-get install -y --no-install-recommends ca-certificates curl git build-essential && \
              rm -rf /var/lib/apt/lists/*
          RUN curl -fsSL https://get.volta.sh | bash -s -- --skip-setup && \
              mkdir -p "$VOLTA_HOME" && \
              volta install node@v24.2.0 && \
              volta install \
                @anthropic-ai/claude-code \
                @google/gemini-cli \
                @openai/codex \
                openclaw \
                jsonlint \
                opencode-ai \
                markdownlint-cli && \
              npm_config_ignore_scripts=true volta install \
                "@earendil-works/pi-coding-agent@${PI_CODING_AGENT_VERSION}" && \
              command -v openclaw && \
              command -v pi && \
              pi --version
          DOCKERFILE
          set +e
          docker build --no-cache --progress=plain \
            -f /tmp/Dockerfile.pi-node-layer \
            -t pi-node-layer-diagnostic /tmp \
            > /tmp/pi-node-layer.log 2>&1
          rc=$?
          tail -n 40 /tmp/pi-node-layer.log
          exit "$rc"
