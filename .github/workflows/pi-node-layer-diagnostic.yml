---
name: Diagnose full Docker build

'on':
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'feat/add-pi-coding-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build with concise failure log
        shell: bash
        run: |
          set +e
          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=min \
            . > /tmp/full-build.log 2>&1
          rc=$?
          tail -n 80 /tmp/full-build.log
          exit "$rc"
