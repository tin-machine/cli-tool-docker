---
name: Diagnose full Docker build

'on':
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'feat/add-pi-coding-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build final stage and print errors only
        shell: bash
        run: |
          git clone -q --depth 1 --branch feat/add-pi-coding-agent \
            https://github.com/tin-machine/cli-tool-docker.git /tmp/cli-tool-docker
          cd /tmp/cli-tool-docker
          docker buildx create --use >/dev/null
          set +e
          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            --target final \
            --cache-from type=gha \
            . > /tmp/full-build.log 2>&1
          rc=$?
          grep -E -i -B 3 -A 5 \
            'error|failed|could not|not found|no space|checksum|did not complete' \
            /tmp/full-build.log | tail -n 35 || true
          exit "$rc"
