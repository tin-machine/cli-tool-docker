---
name: Scheduled Vulnerability Scan

'on':
  workflow_dispatch:
  schedule:
    # 毎週金曜日の午前8時(UTC)に実行 (日本時間の午後5時)
    - cron: '0 8 * * 5'

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # ghcr.ioからイメージをpullするために必要

    steps:
      - name: Scan latest image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/cli-tool-docker:latest'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '30m'

      - name: Check scan results
        id: check_results
        run: |
          if [ -s "trivy-results.txt" ]; then
            echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT
            # Slackのメッセージサイズ制限を考慮し、結果を一部抜粋または要約する
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            head -n 50 trivy-results.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "vulnerabilities_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload vulnerability report as artifact
        if: steps.check_results.outputs.vulnerabilities_found == 'true'
        id: upload_report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: trivy-results
          path: trivy-results.txt
          retention-days: 30

      # Incoming Webhook はファイル添付できないため、抜粋と Artifact へのリンクを送る
      - name: Build Slack payload for vulnerability report
        if: steps.check_results.outputs.vulnerabilities_found == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        run: |
          # Slack の section text は 3000 文字上限のため抜粋する
          excerpt="$(head -c 2500 trivy-results.txt)"
          jq -n \
            --arg excerpt "$excerpt" \
            --arg run_url "$RUN_URL" \
            --arg artifact_url "${ARTIFACT_URL:-$RUN_URL}" \
            '{
              text: "⚠️ 定期脆弱性スキャン: latest イメージで脆弱性が検出されました",
              blocks: [
                { type: "section", text: { type: "mrkdwn",
                  text: "⚠️ *定期脆弱性スキャンレポート*\n`latest` イメージで脆弱性が検出されました。全文は <\($artifact_url)|レポート (Artifact)> を確認してください。" } },
                { type: "section", text: { type: "mrkdwn",
                  text: ("```\n" + $excerpt + "\n```") } },
                { type: "actions", elements: [
                  { type: "button", text: { type: "plain_text", text: "ワークフロー実行結果を見る" }, url: $run_url }
                ] }
              ]
            }' > slack-payload.json

      - name: Upload vulnerability report to Slack
        if: steps.check_results.outputs.vulnerabilities_found == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json

      - name: Notify Slack about no vulnerabilities
        if: steps.check_results.outputs.vulnerabilities_found == 'false'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ 定期脆弱性スキャン完了: ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *定期脆弱性スキャン完了*\n`latest`イメージで新たな脆弱性は検出されませんでした。"
                  }
                }
              ]
            }
