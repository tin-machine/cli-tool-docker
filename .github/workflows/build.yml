---
name: Repair tmux build pin

'on':
  pull_request:
    branches:
      - main

jobs:
  pin-tmux:
    if: github.head_ref == 'feat/add-pi-coding-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Pin tmux 3.7b
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("Dockerfile"); s=p.read_text(); s=s.replace("FROM build AS tmux-build\nWORKDIR /build/tmux\n", "FROM build AS tmux-build\nARG TMUX_VERSION=3.7b\nWORKDIR /build/tmux\n", 1); s=s.replace("RUN git clone https://github.com/tmux/tmux.git . && \\\n", "RUN git clone --depth 1 --branch \"${TMUX_VERSION}\" https://github.com/tmux/tmux.git . && \\\n", 1); p.write_text(s)'
          git diff -- Dockerfile
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Dockerfile
          if git diff --cached --quiet; then
            echo 'tmux block already pinned or not found'
            exit 1
          fi
          git commit -m 'Pin tmux build to 3.7b'
          git push origin HEAD:${{ github.head_ref }}
