---
name: Repair stale Node CLI package

'on':
  pull_request:
    branches:
      - main

concurrency:
  group: repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replace-clawdbot:
    if: github.head_ref == 'feat/add-pi-coding-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace retired package name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dockerfile")
          content = path.read_text()
          old = "      clawdbot \\\n"
          new = "      openclaw \\\n"
          if old not in content:
              print("clawdbot entry already absent")
              raise SystemExit(0)
          path.write_text(content.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Dockerfile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Replace stale clawdbot package'
          git push origin HEAD:${{ github.head_ref }}
