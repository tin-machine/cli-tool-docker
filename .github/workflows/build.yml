---
name: Build and Push Multi-Platform Docker Image

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint YAML & Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
      - name: Run shellcheck on shell scripts
        uses: azohra/shell-linter@v0.6.0
        with:
          files: entrypoint.bash shell.bash

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Build and Push Docker Image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     push: true
      #     platforms: linux/amd64
      #     tags: ghcr.io/${{ github.repository_owner }}/cli-tool-docker:latest

      # PRの場合のタグ
      - name: Build and Push Docker Image (for PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/cli-tool-docker:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # mainブランチへのpushの場合のタグ
      - name: Build and Push Docker Image (for main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/cli-tool-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C075AE23M9P'
          payload: |
            {
              "text": "ビルド結果: ${{ job.status }} / ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "ビルド結果: ${{ job.status }}\n`${{ github.repository }}` / `${{ github.ref_name }}`"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*リポジトリ:*\n`${{ github.repository }}`" },
                    { "type": "mrkdwn", "text": "*ブランチ:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*実行者:*\n`${{ github.actor }}`" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "ワークフロー実行結果を見る" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  build-arm64-workspace:
    name: Build ARM64 workspace image
    needs: lint
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: workspace-flat
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cli-tool-docker:arm64-${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=min,scope=arm64
      - name: Verify published ARM64 manifest
        run: |
          image_ref="ghcr.io/${{ github.repository_owner }}/cli-tool-docker:arm64-${{ github.sha }}"
          docker buildx imagetools inspect "$image_ref"
          digest="$(
            docker buildx imagetools inspect --raw "$image_ref" |
              jq -er '.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == "arm64")
                | .digest'
          )"
          docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository_owner }}/cli-tool-docker@$digest" | jq -e '.layers | length == 1'
      - name: Smoke test ARM64 workspace identity and CLI tools
        run: |
          mkdir -p "$RUNNER_TEMP/cli-home" "$RUNNER_TEMP/cli-state"
          docker run --rm \
            -v "$RUNNER_TEMP/cli-home:/work-home" \
            -v "$RUNNER_TEMP/cli-state:/work-state" \
            -e HOME=/work-home \
            -e USER_NAME=workspace \
            -e CLI_USER_ID="$(id -u)" \
            -e CLI_GROUP_ID="$(id -g)" \
            -e CLI_WORKSPACE_MODE=1 \
            -e CODEX_HOME=/work-state/codex \
            ghcr.io/${{ github.repository_owner }}/cli-tool-docker:arm64-${{ github.sha }} \
            bash -lc 'test "$(id -u)" = "$CLI_USER_ID" && test "$HOME" = /work-home && test -w "$HOME" && test -w "$CODEX_HOME" && command -v git && command -v tmux && command -v nvim && command -v codex && command -v pi && command -v uvx'

  # リリースノート作成（mainブランチ push 時）
  release-draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@v5
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
