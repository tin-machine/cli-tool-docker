---
name: Pin stable tmux release

'on':
  pull_request:
    branches:
      - main

concurrency:
  group: repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-tmux:
    if: github.head_ref == 'feat/add-pi-coding-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Pin tmux 3.7b
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dockerfile")
          content = path.read_text()
          old = '''FROM build AS tmux-build
          WORKDIR /build/tmux
          RUN git clone https://github.com/tmux/tmux.git . && \\
              git fetch origin && \\
              sh autogen.sh && \\
'''
          new = '''FROM build AS tmux-build
          ARG TMUX_VERSION=3.7b
          WORKDIR /build/tmux
          RUN git clone --depth 1 --branch "${TMUX_VERSION}" https://github.com/tmux/tmux.git . && \\
              sh autogen.sh && \\
'''
          if old not in content:
              print("expected tmux block not found or already updated")
              raise SystemExit(0)
          path.write_text(content.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Dockerfile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Pin tmux build to 3.7b'
          git push origin HEAD:${{ github.head_ref }}
